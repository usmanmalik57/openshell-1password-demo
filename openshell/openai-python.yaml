# OpenAI provider profile for bugfix-bot. It's NVIDIA's providers/openai.yaml with one change:
# `binaries` names the Python interpreter (the real path behind the venv's python),
# so only Python processes can use the OpenAI key, and curl can't.
id: openai
display_name: OpenAI
description: OpenAI inference API, for Python agents
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/python3.12]
