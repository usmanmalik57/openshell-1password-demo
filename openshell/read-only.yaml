# Sandbox rules while the agent works: no push.
# Reading GitHub comes from OpenShell's GitHub provider profile, which allows clone and fetch only.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
