version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  github_repository_push:
    name: github-repository-push
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/usmanmalik57/openshell-1password-demo.git/info/refs*"
          - allow:
              method: POST
              path: "/usmanmalik57/openshell-1password-demo.git/git-upload-pack"
          - allow:
              method: POST
              path: "/usmanmalik57/openshell-1password-demo.git/git-receive-pack"
    binaries:
      - path: /usr/bin/git
      - path: /usr/local/bin/git
